# lefthook.yml — ASTGL standard local gate stack.
#
# Design rule: cheap and always-on at pre-commit, expensive at pre-push,
# metered (CodeRabbit) never automatic.
#
#   pre-commit  ~1-3s   format, lint, secrets on staged files only
#   pre-push    ~5-60s  tests, workflow lint, full-history secret scan
#   manual      metered `cr review` — you decide when to spend it
#
# Escape hatches:
#   LEFTHOOK=0 git commit ...            skip everything
#   LEFTHOOK_EXCLUDE=tests git push      skip one job
#   git commit --no-verify               nuclear option

# 1.7.3 is where list-of-globs `exclude` landed. Below that the lint-yaml
# exclusions below are silently ignored.
min_version: 1.7.3
colors: true

# ---------------------------------------------------------------------------
pre-commit:
  parallel: true
  commands:

    # ADVISORY as of 2026-08-09 — reports, does not rewrite, does not block.
    #
    # WHY the `stage_fixed: true` went away: it re-stages after the ENTIRE hook
    # finishes, not after the command that owns it. Measured, fully serialised,
    # formatter declared first:
    #
    #   STEP1 formatter, immediately after writing:  staged=ORIGINAL
    #   STEP2 validator:                             staged=ORIGINAL
    #   STEP3 later job:                             staged=ORIGINAL
    #   after the hook completes:                    FORMATTED
    #
    # So every gate in this hook inspected the PRE-format blob while the
    # POST-format blob was committed. That is wrong for every gate here, in
    # different sizes: `secrets`, `secrets-binaries` and `aikido` cleared bytes
    # that were not the ones committed, and `no-big-files` measured a blob that
    # was not the one committed either — a reformat changes whitespace and line
    # breaks, so a file sitting just under the limit can cross it on the way in.
    # Unlikely at a 5 MiB threshold, but "unlikely" is not "cannot", and a gate
    # whose correctness rests on an unstated size assumption is not a gate. A
    # gate that inspects the wrong artifact is the defect this whole file exists
    # to avoid.
    #
    # Ordering does NOT fix it, which is the counter-intuitive part and the
    # reason this is not simply `parallel: false`. That was measured too:
    # `parallel: false` and `priority` both still show the validator the
    # pre-format blob, and `parallel: false` costs 3x the wall clock (3793ms vs
    # 1216ms on a six-job sample) against this file's 1-3s budget. Nothing
    # in-hook can move the index in time, because lefthook does not update it
    # until the hook is over.
    #
    # The cost is stated rather than hidden: newly unformatted Python is now
    # REPORTED, not fixed for you. The contract, stated so nobody has to infer
    # it from the shell: exit 0 is clean, exit 1 is "would reformat" and is
    # ADVISORY so it passes, anything above 1 is ruff itself failing and BLOCKS.
    #
    # This is `ruff format --check` — the FORMATTER, where --check is a flag.
    # `lint-python` below runs `ruff check`, the LINTER, a different subcommand.
    # They are separate tools with separate exit-code meanings, so do not reason
    # from one to the other. This job also has no blanket `|| true`; that one
    # does.
    #
    # To make formatting blocking again, change that `-gt 1` to `-gt 0`, so a
    # would-reformat (exit 1) fails too. Do NOT restore
    # `stage_fixed: true` to get auto-formatting back without re-reading the
    # above: it returns every gate in this hook to inspecting stale content.
    format-python:
      tags: format
      glob: "*.py"
      run: |
        rc=0
        # {staged_files} IS SHELL-QUOTED by lefthook — measured, not assumed. #8
        # carried this and three sibling jobs as "take {staged_files} unquoted",
        # which would make any filename with a space split into two arguments.
        # Differential run: two files with spaces in their names, one deliberately
        # invalid, staged together. yamllint received the whole path and reported
        # `bad name.yml  2:3 error syntax error`. A mangled expansion would have
        # produced "No such file" instead, so the control distinguishes the two.
        # The `--` below is still worth keeping: it covers a filename that BEGINS
        # with `-`, which quoting does not address.
        ruff format --check -- {staged_files} || rc=$?
        # 0 clean, 1 would-reformat. Advisory covers the SECOND one only.
        # Anything else is ruff failing rather than a formatting difference:
        # 2 = bad config or internal error, 127 = not installed. `|| true`
        # swallowed all four identically, so a broken or absent formatter
        # reported as a clean pass — the failure mode this whole file exists to
        # avoid. Before this job went advisory it had no `|| true` at all and
        # those DID block; that behaviour is restored here deliberately.
        if [ "$rc" -gt 1 ]; then
          echo "✗ ruff format exited $rc — the formatter itself failed; this is not a formatting difference"
          exit "$rc"
        fi

    # ADVISORY, by deliberate choice — reports but does not block.
    #
    # WHY: a repo with pre-existing lint debt fails these on the first commit,
    # every commit, before you have touched the offending file. That teaches you
    # to reach for LEFTHOOK=0, and a gate you habitually bypass protects nothing
    # while still costing you the pause. Secrets, commit-msg, big-files and
    # tests stay hard: those catch things you cannot un-ship.
    #
    # Note there is no --fix / stage_fixed here. Advisory means REPORT. A job
    # that silently rewrites your source while claiming to be non-blocking is
    # the worst of both — `ruff --fix` will drop `# noqa` directives it judges
    # unused, which during this kit's pilot removed a `# noqa: E402` that
    # existed because matplotlib.use("Agg") must precede the pyplot import.
    #
    # Making the jobs BELOW this line blocking again is a one-line change: drop
    # their `|| true`. The scope matters, because this sentence sits directly
    # under format-python, which has NO `|| true` at all since the exit-code fix —
    # for that job the one-line change is `-gt 1` → `-gt 0`, stated correctly in
    # its own block above. A reader scanning upward from here got the wrong
    # instruction for the nearest job, and the two adjacent jobs now use
    # genuinely different mechanisms.
    lint-python:
      tags: lint
      glob: "*.py"
      run: ruff check -- {staged_files} || true

    lint-shell:
      tags: lint
      glob: "*.{sh,bash}"
      run: shellcheck -- {staged_files} || true

    lint-powershell:
      tags: lint
      glob: "*.{ps1,psm1,psd1}"
      # WHY single quotes and an env var, not a double-quoted string: in the old
      # form the SHELL expanded $r before pwsh ever saw it, so pwsh received
      # `= Invoke-ScriptAnalyzer -Path … ; if () { … }` and died with a
      # ParserError. Reproduced 2026-08-08: the gate never analysed anything and
      # hard-failed on every staged .ps1. Single quotes keep $r for PowerShell;
      # the env var also survives filenames containing spaces (verified).
      #
      # The Get-Command guard and $ErrorActionPreference = Stop are defence in
      # depth, so an unavailable analyser is a failure rather than a pass.
      # HONEST SCOPE: the "missing module exits 0" failure this was said to fix
      # did NOT reproduce on pwsh 7.5.4 / current PSScriptAnalyzer -- both the
      # old and new forms exit 1 there, for a missing command and for a
      # non-terminating error alike. Kept because failing closed by construction
      # is right regardless, but do not cite it as an observed bug.
      run: |
        for f in {staged_files}; do
          PSSA_PATH="$f" pwsh -NoProfile -Command '
            $ErrorActionPreference = "Stop"
            if (-not (Get-Command Invoke-ScriptAnalyzer -ErrorAction SilentlyContinue)) {
              Write-Error "PSScriptAnalyzer not installed: Install-Module PSScriptAnalyzer -Scope CurrentUser"
              exit 1
            }
            $r = Invoke-ScriptAnalyzer -Path $env:PSSA_PATH -Severity Error,Warning
            if ($r) { $r | Format-Table -AutoSize; exit 1 }
          ' || exit 1
        done

    lint-yaml:
      tags: lint
      glob: "*.{yml,yaml}"
      # `exclude` must be a LIST of globs. The old "a|b" regex form was removed
      # in lefthook v2.0.0, so it silently matched nothing — yamllint was linting
      # lefthook.yml itself and reporting line-length warnings on every commit.
      exclude:
        - "lefthook.yml"
        - ".coderabbit.yaml"
      run: yamllint -d relaxed -- {staged_files}

    # The single most important hook in this file. Secrets must never reach
    # GitHub *or* CodeRabbit's cloud. This is your data-egress boundary.
    #
    # Routed through scripts/gitleaks-guard.sh rather than calling gitleaks directly.
    # WHY: a bare `gitleaks` runs whatever binary is on PATH, and allowlist semantics
    # differ across versions — local runs used 8.30.1 while a CodeRabbit review sandbox
    # on PR #5 reported 1.7.3. A scanner whose version you cannot name is a scanner
    # whose coverage you cannot state. The guard asserts a floor and then execs
    # gitleaks; the version lives in scripts/gitleaks-version.env.
    #
    # `git --staged` rather than the old `protect --staged`: `protect` is a deprecated
    # alias, already absent from `gitleaks --help` in 8.30.1 and on its way out. Both
    # forms were checked against the same staged fixture and produce identical results
    # (scripts/test-gitleaks-guard.sh asserts the `git --staged` path specifically).
    secrets:
      tags: security
      run: ./scripts/gitleaks-guard.sh git --staged --redact --no-banner --verbose

    # Second pass for what the gate above provably cannot see.
    #
    # WHY this is a separate step and not a config tweak: gitleaks' built-in
    # allowlist -- inherited by .gitleaks.toml via `[extend] useDefault = true`
    # -- skips pdf/xlsx/docx/bin/exe BY PATH, so `secrets` prints "no leaks
    # found" after reading ~0 bytes of them. Verified 2026-08-08 on gitleaks
    # 8.30.1. You cannot fix that in .gitleaks.toml: the exclusion is upstream,
    # and dropping useDefault to escape it would discard the entire built-in
    # ruleset -- a far worse trade. The script sidesteps it by changing the PATH
    # gitleaks sees (a *.zip temp name, or extracted text via stdin), which keeps
    # .gitleaks.toml as the single source of truth with every built-in rule live.
    #
    # It reports N-scanned and fails closed: a file it should have been able to
    # read but could not comes back UNKNOWN, never clean.
    secrets-binaries:
      tags: security
      # NOT `[ -x ]`, for the reason spelled out at selftest-binary-scan: a guard
      # that SKIPS when the script is missing converts "binaries were never scanned"
      # into a silent pass, which is the exact failure this job exists to close.
      # #18 suggested adding that guard so the YAML could be propagated ahead of the
      # scripts; the kit went the other way, and provisioning now ships both together.
      # A bare `run:` does fail when the file is absent — but ANONYMOUSLY, as a shell
      # "no such file" naming neither the job nor what went unscanned. Name it.
      run: |
        if [ ! -f scripts/scan-staged-binaries.sh ]; then
          echo "✗ scripts/scan-staged-binaries.sh is missing — binaries in this commit are UNSCANNED"
          echo "    This is not a clean result. Restore it from the kit:"
          echo "    10-repo-init.sh --path . --no-remote"
          exit 1
        fi
        bash scripts/scan-staged-binaries.sh

    # Aikido secret scanner.
    #
    # WHY this lives here: this machine sets core.hooksPath globally to
    # ~/.git-hooks, where an Aikido pre-commit hook runs in every repo. Because
    # core.hooksPath makes Git ignore .git/hooks entirely, 10-repo-init.sh sets
    # a repo-LOCAL core.hooksPath=.git/hooks so lefthook's hooks fire at all.
    # That local override also takes this repo out of Aikido's global reach, so
    # the scan is re-attached here rather than lost.
    #
    # Guarded so the template stays portable: no scanner, no-op, no failure.
    aikido:
      tags: security
      run: |
        SCANNER="$HOME/.local/bin/aikido-local-scanner"
        [ -x "$SCANNER" ] || exit 0
        "$SCANNER" pre-commit-scan "$(git rev-parse --show-toplevel)"

    # Catch broken workflows before they burn Actions minutes on a flaky day.
    lint-workflows:
      tags: lint
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint -- {staged_files}

    # Keep the CodeRabbit config honest.
    #
    # Requires CLI >= 0.7.0. Older builds answer "Unknown command: config" and
    # this gate fails on the first commit that stages .coderabbit.yaml — which
    # is the provisioning commit itself. 00-bootstrap-machine.sh warns on an
    # older CLI; upgrade with `brew upgrade --cask coderabbit`.
    #
    # Note the schema caps tone_instructions at 250 characters, and the CLI
    # treats an over-length value as an ERROR. Measure before editing.
    validate-coderabbit:
      tags: config
      glob: ".coderabbit.yaml"
      run: cr config validate

    # Fail fast on accidentally committed large files.
    #
    # WHY this job enumerates the index itself instead of taking {staged_files}:
    # lefthook filters that list to paths present in the WORKING TREE, so
    # `git add big.bin` followed by `rm big.bin` sent the blob into the commit
    # unchecked. Measured: git reports the path, lefthook passes an empty list
    # and then skips the job outright -- the log line is literally
    # "no-big-files (skip) no files for inspection". The gate does not pass,
    # it never runs, which is why this is a path-source fix and not a
    # measurement fix: no care inside the loop can see a file the loop is
    # never given.
    #
    # `git diff --cached --raw` is the source because one record carries
    # everything needed: the entry exists regardless of the working tree, the
    # destination blob sha is right there, the mode identifies submodules, and
    # the path follows a TAB (git C-quotes anything with a newline, so one
    # record stays on one line). Not a whitespace fix — lefthook does quote
    # {staged_files} correctly, verified — but it does drop the dependency on
    # that quoting, the same way reading the index drops the dependency on
    # lefthook's stashing below.
    #
    # WHY the size comes from the staged blob and not the working tree: for
    # ordinary file shapes they differ, and `wc -c` measured the wrong one.
    #   - symlink: `wc -c` follows it and reports the TARGET's size, while the
    #     blob is just the link path
    #   - clean filter (git-lfs): the working tree holds the whole asset, the
    #     blob is a small pointer
    # The old check blocked both — advising you to "use LFS" about a file
    # already stored in LFS. Note it did NOT leak a blob on a stage-then-shrink,
    # contrary to the reasoning in astgl-articles PR 44: lefthook hides
    # partially staged files, so the working tree already matched the staged
    # content and the old check blocked there too.
    #
    # The gitlink skip is required now that the index is the source: a submodule
    # is mode 160000 and points at a commit in the SUBMODULE's object store,
    # which this repo does not have, so `git cat-file` fails on it. Taking the
    # mode from the same --raw record makes the check free; a per-file
    # `git ls-files -s` probe doubled the loop (5.6s -> 10.6s over 200 files).
    #
    # The filter is ACMRT, not ACMR. A type change counts: if HEAD has a
    # symlink at a path and the index now has a 6MB regular file there, the
    # status is T and ACMR enumerates NOTHING -- verified, the blob went
    # straight through. D is excluded because a deletion stages no blob, and
    # U because an unmerged entry has no single destination sha and would
    # abort the hook mid conflict-resolution.
    #
    # The rejection message prints exact bytes, not a rounded unit. 1048576 is
    # a MiB, and the old `$((size/1048576))MB` both mislabelled it and truncated:
    # a blob one byte over the limit reported "is 5MB" against a 5MB limit,
    # reading as though it were AT the limit rather than over it. The threshold
    # lives in LIMIT so the comparison and the message cannot drift apart.
    #
    # `set -eu` is the fail-closed backstop: an unreadable entry aborts the hook
    # and REFUSES the commit rather than skipping the file. Two shapes here are
    # deliberate — the loop is fed by REDIRECTION, not a pipe, so `exit 1` exits
    # the hook instead of a subshell; and the gitlink test is an `if`, not
    # `&& continue`, because a failing `&&` list would itself trip errexit.
    no-big-files:
      tags: hygiene
      # MOVED OUT OF THIS FILE, deliberately. The logic is unchanged in what it
      # blocks; what changes is that it can now be TESTED. This check was wrong in
      # four distinct ways in a single day and three of those were introduced while
      # fixing the previous one (#12) — an inline `run:` block cannot be exercised by
      # anything, so every version was validated by reading it, which is precisely
      # how four wrong versions shipped. scripts/selftest-no-big-files.sh covers 17
      # shapes including the ones that produced each historical defect.
      # Named absence, never a skip, for the reason at secrets-binaries above.
      run: |
        if [ ! -f scripts/check-big-files.sh ]; then
          echo "✗ scripts/check-big-files.sh is missing — large blobs are UNCHECKED"
          echo "    Restore it from the kit:  10-repo-init.sh --path . --no-remote"
          exit 1
        fi
        bash scripts/check-big-files.sh

# ---------------------------------------------------------------------------
commit-msg:
  commands:
    conventional:
      # CodeRabbit and `gh pr create --fill` both key off commit subjects.
      # Consistent prefixes make PR titles write themselves.
      run: |
        head -n1 {1} | grep -qE '^(feat|fix|docs|refactor|test|chore|perf|ci|build|revert)(\(.+\))?!?: .{3,}' || {
          echo "✗ Commit subject must be conventional, e.g.:"
          echo "    feat(ladder): add project 07 file walker"
          echo "    fix(jdex): handle missing index on first run"
          exit 1
        }

# ---------------------------------------------------------------------------
pre-push:
  # DELIBERATE BUT UNMEASURED, and recorded as such so nobody invents a
  # justification for it later. pre-commit runs `parallel: true`; the 4x wall-clock
  # cost that #16 measured, and the staging-race story that was used to justify
  # serialising, both belong to that hook and are settled there. The reasoning does
  # NOT transfer: no pre-push job writes the index either, so ordering buys nothing
  # here for the same reason it bought nothing there.
  #
  # It stays `false` anyway because the cost has not been demonstrated. An attempt
  # to measure it produced a null result that was pure artifact -- every pre-push
  # job reported `(skip) no matching push files`, so the ~570ms recorded was
  # lefthook's own startup and said nothing about parallelism. A real measurement
  # needs a repo where `tests`, `typecheck` and both self-test suites actually run.
  #
  # If you come to change this: measure first, and confirm the jobs RAN. Do not
  # re-derive a mechanism from this comment -- that is exactly how `parallel: false`
  # reached 42 repos on a staging race that does not exist (#16).
  parallel: false
  commands:

    tests:
      tags: tests
      run: |
        # WHY this is not "pytest whenever a tests/ dir exists": a tests/
        # directory does not imply Python. In a shell-only repo
        # (tests/test-*.sh) pytest collects nothing and exits 5, which
        # lefthook reads as a failed gate -- so pre-push blocked EVERY push,
        # with nothing in the output naming the cause. Verified 2026-08-08 in
        # UpdateKit, content-repurposer, geekspace, macstudio-dr,
        # openclaw-swarm, viceroy.
        #
        # WHY the exit code is switched on rather than short-circuited with
        # &&: collection has THREE outcomes, not two. 0 = collected,
        # 5 = nothing to collect, anything else = collection ERRORED
        # (claudeclaw returns 2 on broken imports). Short-circuiting would
        # silently skip a suite that is genuinely broken -- trading a blocked
        # push for an invisible one, which is the worse failure and the one
        # this repo exists to prevent. Only 5 is a legitimate skip.
        #
        # Shell suites (tests/test-*.sh) are deliberately still NOT run here.
        # Making 63 repos start executing them on pre-push is a separate
        # decision with its own blast radius.
        if ! command -v pytest >/dev/null 2>&1; then
          echo "  (pytest not installed — skipping)"
        else
          pytest -q --collect-only >/dev/null 2>&1
          collect_rc=$?
          case "$collect_rc" in
            0) pytest -q --maxfail=1 ;;
            5) echo "  (no Python tests collected — skipping)" ;;
            *) echo "  pytest collection FAILED (exit $collect_rc)." >&2
               echo "  This is NOT 'no tests' -- see the error below." >&2
               pytest -q --collect-only
               exit "$collect_rc" ;;
          esac
        fi

    typecheck:
      tags: types
      run: |
        if command -v mypy >/dev/null 2>&1 && [ -f pyproject.toml ]; then
          mypy . || true   # advisory until the codebase is fully annotated
        fi

    # Prove the scanner still behaves the way .gitleaks.toml says it does.
    #
    # WHY this runs BEFORE secrets-history: the history scan's verdict is only worth
    # what the scanner's coverage is worth. A version floor rules out the catastrophic
    # old-binary case but says nothing about semantic drift above the floor, so the
    # coverage claims are asserted directly. Costs ~1s; runs on this machine on purpose,
    # because the installed binary is a property of this machine and CI cannot check it.
    secret-scan-selftest:
      tags: security
      # Same reasoning as secrets-binaries and selftest-binary-scan: name the
      # absence rather than failing as a bare "no such file", and never skip.
      # `bash <script>` so a dropped execute bit is not itself a failure mode.
      run: |
        if [ ! -f scripts/test-gitleaks-guard.sh ]; then
          echo "✗ scripts/test-gitleaks-guard.sh is missing — the secret scanner is unverified"
          echo "    A scanner nobody checks is how the binary blind spot survived."
          echo "    Restore it from the kit:  10-repo-init.sh --path . --no-remote"
          exit 1
        fi
        bash scripts/test-gitleaks-guard.sh

    # Scan the commits actually being pushed.
    #
    # WHY the range is computed rather than hardcoded to @{push}: that revision
    # only resolves once the branch HAS an upstream. With push.autoSetupRemote
    # enabled (00-bootstrap-machine.sh sets it globally) the upstream is created
    # BY the push — so during pre-push on a brand-new branch @{push} fails with
    # "no upstream configured", and the gate blocks the first push of every
    # feature branch. A gate that fires on every new branch is a gate you learn
    # to bypass, which costs more than it protects.
    secrets-history:
      tags: security
      run: |
        if git rev-parse --verify --quiet '@{push}' >/dev/null 2>&1; then
          RANGE="@{push}..HEAD"
        else
          # No upstream yet. Diff against the remote's default branch if we can
          # see it; otherwise scan the whole history (first push of a new repo).
          BASE=""
          for c in main master; do
            git show-ref --verify --quiet "refs/remotes/origin/$c" && { BASE="origin/$c"; break; }
          done
          if [ -n "$BASE" ]; then RANGE="$BASE..HEAD"; else RANGE=""; fi
        fi
        if [ -n "$RANGE" ]; then
          ./scripts/gitleaks-guard.sh git --no-banner --redact --log-opts="$RANGE"
        else
          ./scripts/gitleaks-guard.sh git --no-banner --redact
        fi

    workflows:
      tags: lint
      run: |
        if [ -d .github/workflows ]; then
          actionlint
        fi

    # The binary secret gate is itself testable, so test it. A scanner nobody
    # verifies is how the original hole survived review in the first place.
    selftest-no-big-files:
      tags: hygiene
      # The recurrence probe from #12. Same shape and same reason as
      # selftest-binary-scan below: a gate that was wrong four times in one day is
      # guarded by a suite that ships with it, so every provisioned repo inherits
      # the regression test rather than one repo holding a copy that the next
      # repo-init overwrites.
      run: |
        if [ ! -f scripts/selftest-no-big-files.sh ]; then
          echo "✗ scripts/selftest-no-big-files.sh is missing — the size gate is unverified"
          echo "    Restore it from the kit:  10-repo-init.sh --path . --no-remote"
          exit 1
        fi
        bash scripts/selftest-no-big-files.sh

    selftest-binary-scan:
      tags: security
      run: |
        # NOT `[ -x ]`. A guard that skips when the file is missing or lost its
        # execute bit turns "the binary gate is unverified" into a silent pass —
        # the same fail-open this self-test exists to detect. The neighbouring
        # secret-scan-selftest runs its script unconditionally; match it.
        # `bash <script>` rather than `./<script>` so a dropped execute bit is
        # not itself a failure mode.
        if [ ! -f scripts/selftest-binary-scan.sh ]; then
          echo "✗ scripts/selftest-binary-scan.sh is missing — the binary gate is unverified"
          exit 1
        fi
        bash scripts/selftest-binary-scan.sh

# ---------------------------------------------------------------------------
# Metered CodeRabbit review — NOT wired to a git hook on purpose.
# Free tier is 3 reviews/hour; the usage add-on bills per file reviewed.
# Run deliberately:  lefthook run review
review:
  commands:
    coderabbit:
      run: cr review --base "${CR_BASE:-main}"
