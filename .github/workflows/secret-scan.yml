# WHAT: the authoritative secret scan. Runs an exactly-pinned, checksum-verified
#       gitleaks, so the verdict does not depend on any developer machine.
#
# WHY this exists alongside the lefthook hooks: the local gate enforces a version
# FLOOR (scripts/gitleaks-version.env explains why an exact local pin would be worse).
# A floor still permits two developers to get different answers. This job is the one
# result that is reproducible by construction — same version, same checksum, same
# config, every run.
#
# TRUST BOUNDARY: on a pull_request this job scans the PR's CONTENT with the BASE
# branch's SCANNER. The scripts, the pinned version, the checksums and .gitleaks.toml
# all come from a second checkout at the base commit (`trusted-scanner/`), because
# loading them from the candidate let a PR neutralise the check that judges it --
# allowlist the secret it adds, or make the self-test exit 0, and the required check
# goes green having verified nothing. A check described as "reproducible by
# construction" cannot take its construction from its own input.
#
# CONSEQUENCE, stated because it is surprising: a PR that legitimately CHANGES the
# scanner is validated by the OLD scanner, so scanner-behaviour changes only take
# effect for the NEXT PR. That is correct for the trust question and wrong-looking
# for the author, which is why the candidate's own self-test still runs below as an
# explicitly ADVISORY step -- visible, never gating.
#
# Injection note: the only `github.event.*` value used anywhere in this file is
# `pull_request.base.sha`, and it appears exactly once, as a `with: ref:` input to
# actions/checkout. Action inputs are not shell-evaluated, and a base SHA is a
# 40-char hex id chosen by git rather than text an author can author. Nothing here
# interpolates any event value into a `run:` block. `github.ref` in the concurrency
# group is likewise never shell-evaluated.

name: secret-scan

on:
  # `pull_request:` carries no branch filter on purpose, so every PR is scanned
  # whatever its base — including stacked PRs onto long-lived branches, which is
  # exactly where review coverage was silently lost before.
  pull_request:
  # The push trigger is only a backstop for commits that reach the default branch
  # without a PR. It is pinned to `main`: in a repo whose default branch is named
  # something else this trigger NEVER FIRES, and nothing warns you. That is
  # tolerable because PR coverage above is unconditional and the house rule is
  # never to push to the default branch directly — but if you rely on the
  # backstop, change this name to match the repo.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    # A secret scan that hangs is a secret scan that never reports. The history
    # scan on the largest fleet repo completes in well under a minute, so this
    # bounds a stuck download or a pathological regex rather than real work.
    timeout-minutes: 15
    steps:
      # Pinned to a commit SHA, not a tag: a tag is mutable, and this is the workflow
      # that guards the repo's data-egress boundary. This SHA is actions/checkout
      # v4.4.0 — the exact release, not `v4`, because naming a moving tag in the
      # comment gives back the immutability the pin was for: `v4` will one day point
      # somewhere else and the comment will still read as true.
      # Verify with:
      #   gh api repos/actions/checkout/tags --jq '.[]|select(.commit.sha=="<sha>")|.name'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0   # the history scan needs the whole history
          # actions/checkout persists GITHUB_TOKEN into .git/config by DEFAULT.
          # This job triggers on `pull_request` and then executes code from the
          # PR under review (the test-gitleaks-guard.sh step below), so the
          # default would hand a credential to the very code it is inspecting.
          # Nothing here pushes, so there is nothing to lose by refusing it.
          persist-credentials: false

      # The scanner, taken from the base branch rather than from the PR. `path:` must
      # be inside GITHUB_WORKSPACE -- actions/checkout refuses to write outside it --
      # so this lands as a nested, untracked directory. That is harmless here: every
      # enumeration below is ref-based (`BASE...HEAD`), so an untracked directory in
      # the worktree is invisible to it.
      #
      # fetch-depth: 1 -- only the base commit's TREE is needed. The full history that
      # the scan itself walks comes from the candidate checkout above.
      - name: Check out the trusted scanner (PR base)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-scanner
          fetch-depth: 1
          persist-credentials: false

      # One place decides which scanner is authoritative, and every step below reads
      # it. On push/workflow_dispatch there is no base to distrust -- the pushed commit
      # IS the trusted code -- so the scanner root is the checkout itself.
      - name: Resolve the trusted scanner root
        run: |
          set -euo pipefail
          # ABSOLUTE, not relative. `trusted-scanner` and `.` both happen to resolve
          # correctly only while every later step runs from the workspace root.
          # Nothing sets `working-directory:` today, so this is right now and brittle
          # later: adding one would turn "$SCANNER_ROOT/scripts/..." into a missing
          # path, and on the `.` branch it would silently resolve to a DIFFERENT
          # directory rather than failing. -u makes GITHUB_WORKSPACE an assertion.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            root="$GITHUB_WORKSPACE/trusted-scanner"
          else
            root="$GITHUB_WORKSPACE"
          fi

          # Assert rather than assume. If the `if:` above and this condition ever
          # drift, the fallback would be to scan the PR with the PR's own scanner --
          # silently restoring the exact defect this design removes. A missing
          # trusted checkout is UNKNOWN, never "carry on with the candidate".
          # scan-staged-binaries.sh belongs in this list because the binary step
          # below invokes it from the trusted root; without it that step fails with
          # a bare "No such file", naming neither the scanner nor the trust boundary.
          #
          # ABSENT AND INCOMPLETE ARE DIFFERENT STATES, and collapsing them is what
          # deadlocked every first-adoption PR. Counted rather than short-circuited,
          # because "which files are missing" is the whole signal:
          #
          #   all present  -> trusted root stands; probe it below.
          #   ALL missing  -> the base predates the kit. There is no trusted scanner
          #                   to run and no check can conjure one, so this is the
          #                   rollout window, not tampering.
          #   some missing -> a base carrying a PARTIAL scanner is suspicious in a
          #                   way an absent one is not (a deleted gitleaks-version.env
          #                   is how someone would disable pinning). Fail closed.
          # ONE definition, iterated twice below. Held in a variable rather than
          # written out at each site because the two checks must never disagree
          # about what a scanner IS: if a seventh file were added to the base
          # check alone, a candidate missing it would bootstrap anyway, and if it
          # were added to the candidate check alone the base would demand more
          # than the fallback guarantees. Either way the divergence is silent and
          # lands on the security-relevant path.
          trusted_set=(
            scripts/gitleaks-version.env
            scripts/gitleaks-guard.sh
            scripts/test-gitleaks-guard.sh
            scripts/scan-staged-binaries.sh
            scripts/selftest-binary-scan.sh
            .gitleaks.toml
          )
          trusted_total=0
          trusted_present=0
          trusted_missing=""
          for f in "${trusted_set[@]}"; do
            trusted_total=$((trusted_total + 1))
            # -f AS WELL AS -r, for the reason scan-staged-binaries.sh already
            # records at its own config check: `[ -r ]` is true for a DIRECTORY,
            # and truer still for a FIFO. A directory named scripts/gitleaks-guard.sh
            # would count as present here and then fail unreadably three steps later;
            # a FIFO would serve one read and return EOF to every read after it.
            if [ -f "$root/$f" ] && [ -r "$root/$f" ]; then
              trusted_present=$((trusted_present + 1))
            else
              trusted_missing="$trusted_missing $f"
            fi
          done
          # N-compared, always. A check that examined nothing and a check that found
          # everything absent are the same output otherwise -- and the second is now
          # a NON-gating path, so the difference decides whether this job gates.
          echo "trusted scanner: compared $trusted_total file(s), $trusted_present present"
          if [ "$trusted_total" -eq 0 ]; then
            echo "::error::the completeness check examined no files -- it did not run"
            exit 1
          fi

          if [ "$trusted_present" -eq 0 ] && [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # FIRST ADOPTION. Deliberately not gated, and deliberately narrow: only
            # when the base has NONE of it. Note what is actually true on such a PR
            # -- the base has no secret-scan.yml either, so the workflow running this
            # check is itself candidate code. There is no trusted context to preserve
            # here; insisting on a trusted script root while executing an untrusted
            # workflow buys nothing and blocks the only PR that can fix it.
            #
            # Falling back is only coherent if the candidate can actually serve. A
            # candidate missing these files too means something other than adoption
            # is wrong, and the later steps would fail on a bare "No such file"
            # naming neither the scanner nor the boundary.
            for f in "${trusted_set[@]}"; do
              if [ ! -f "$GITHUB_WORKSPACE/$f" ] || [ ! -r "$GITHUB_WORKSPACE/$f" ]; then
                echo "::error::no trusted scanner on the base, and the candidate is"
                echo "  missing $f as well. This is not the rollout window:"
                echo "  a PR adopting the kit necessarily carries all of it."
                exit 1
              fi
            done
            root="$GITHUB_WORKSPACE"
            echo "SCANNER_RANGE_SUPPORT=no" >> "$GITHUB_ENV"
            echo "::warning::BINARY COVERAGE IS UNVERIFIED FOR THIS PR."
            echo "::warning::${GITHUB_BASE_REF:-The base branch} carries no scanner at all, so there is no"
            echo "::warning::trusted copy to scan this PR with. The candidate's own scanner is"
            echo "::warning::being used for the text scan and is NOT trusted for a binary verdict."
            echo "::warning::This resolves itself once this change is on the base branch."
            echo "  compared $trusted_total file(s) on the base, 0 present"
            echo "SCANNER_ROOT=$root" >> "$GITHUB_ENV"
            echo "scanner root: $root (candidate -- first adoption)"
            exit 0
          fi

          if [ "$trusted_present" -ne "$trusted_total" ]; then
            echo "::error::trusted scanner incomplete:$trusted_missing"
            echo "  $trusted_present of $trusted_total files present. A base carrying"
            echo "  SOME of the scanner is not the rollout window -- that window is"
            echo "  all-or-nothing -- so this is treated as tampering or a bad merge."
            echo "  Refusing to fall back to the candidate's own scanner."
            exit 1
          fi

          # THE TRUSTED SCANNER MUST BE NEW ENOUGH TO HONOUR --range/--config.
          #
          # This is the rollout's sharp edge. A base predating this change has no
          # argument parser: it IGNORES --range and --config, scans the candidate
          # checkout's INDEX (empty after checkout), and exits 0. The binary step
          # would then report a clean result having examined nothing -- in the job
          # this file calls authoritative, on exactly the PRs rolling the fix out.
          #
          # Asserted BEHAVIOURALLY rather than by grepping --help, matching the
          # canaries in scan-staged-binaries.sh: --help is a summary, but REJECTING
          # AN UNKNOWN FLAG is the very property we depend on. A parser-bearing
          # scanner exits 2 and says so; a pre-parser one ignores the flag and exits
          # 0. Both the status and the message are required, so an unrelated
          # non-zero exit cannot be mistaken for parser support.
          # FAILING CLOSED HERE WOULD DEADLOCK THE ROLLOUT, so the two causes are
          # separated. The PR that first brings this workflow to a repo necessarily
          # has a base that predates it; blocking the change that ADDS binary
          # coverage because coverage is not yet added is perverse, and there is no
          # second path to merge it. What must never happen is the third option --
          # running the old scanner anyway and printing a clean result.
          probe_rc=0
          probe_out=$("$root/scripts/scan-staged-binaries.sh" --cr-probe-unknown-flag 2>&1) \
            || probe_rc=$?
          # FOUR outcomes, not two. A bare `*)` catch-all would send a permission
          # error, a missing interpreter or any other execution failure down the
          # non-gating bootstrap path -- turning "the scanner would not run at all"
          # into a passing step. Only the MEASURED legacy signature earns the
          # exception; everything else fails closed.
          #
          # That signature is exit 0 plus "no binary or document files", measured
          # against the pre-parser scanner inside a real repo. It is NOT empty
          # output: the old script ignores the flag, enumerates an empty index and
          # prints its ordinary no-op line. Matching on empty output would never
          # fire, which would push the bootstrap case into the fail-closed branch
          # and deadlock the very PRs the exception exists for.
          #
          # THERE ARE TWO PRE-PARSER SIGNATURES, NOT ONE. The arm above was
          # measured against the earliest pre-parser scanner, which reaches its
          # no-op line. A LATER pre-parser revision gained the version pre-flight
          # before it gained an argument parser, so it exits 1 at the guard and
          # never reaches that line -- measured on the bases of 9 repos, whose
          # scanners contain no "unrecognised argument" string anywhere. This
          # probe runs BEFORE the pinned gitleaks is installed, so for such a base
          # the guard fails deterministically, not intermittently.
          # It earns the same non-gating treatment for a stronger reason than the
          # arm above: that scanner refuses and exits 1 WITHOUT scanning, so it
          # cannot print the clean-over-nothing result this design exists to
          # prevent. Matched on the message as well as the status, so an unrelated
          # exit 1 still fails closed. The em dash in the real line is deliberately
          # outside the pattern -- matching it would make this arm depend on the
          # log's encoding surviving intact.
          case "$probe_rc:$probe_out" in
            2:*unrecognised\ argument*)
              echo "SCANNER_RANGE_SUPPORT=yes" >> "$GITHUB_ENV"
              echo "trusted scanner: honours --range/--config" ;;
            1:*"fails the version guard"*)
              # PULL_REQUEST ONLY, like the bootstrap below it. On a push the root is
              # the pushed commit itself, so a guard failure there is a broken commit,
              # not a base predating the parser -- and waving it through would drop
              # binary coverage on the branch with no rollout window to justify it.
              if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
                echo "::error::the scanner failed its own version guard on a $GITHUB_EVENT_NAME run"
                echo "  This is not the rollout window: the scanner here IS the pushed commit."
                echo "  probe exit=$probe_rc, output: $probe_out"
                exit 1
              fi
              echo "SCANNER_RANGE_SUPPORT=no" >> "$GITHUB_ENV"
              echo "::warning::BINARY COVERAGE IS UNVERIFIED FOR THIS PR."
              echo "::warning::${GITHUB_BASE_REF:-The base branch} carries a pre-parser scanner whose"
              echo "::warning::version pre-flight runs before argument parsing, so it cannot be"
              echo "::warning::probed and would ignore --range/--config if run. It is NOT being run."
              echo "::warning::This resolves itself once this change is on the base branch."
              echo "  probe exit=$probe_rc, output: $probe_out" ;;
            0:*"no binary or document files"*)
              # Bootstrap window: real, expected, and strictly time-limited to the
              # PR that lands this. Loud rather than fatal, and the binary step
              # below refuses to claim a verdict.
              echo "SCANNER_RANGE_SUPPORT=no" >> "$GITHUB_ENV"
              echo "::warning::BINARY COVERAGE IS UNVERIFIED FOR THIS PR."
              echo "::warning::${GITHUB_BASE_REF:-The base branch} predates --range support, so the"
              echo "::warning::trusted scanner cannot scan this PR's range. It is NOT being run:"
              echo "::warning::it would ignore the flags and report clean over nothing."
              echo "::warning::This resolves itself once this change is on the base branch."
              echo "  probe exit=$probe_rc, output: $probe_out" ;;
            *)
              # This text is CI output, not a comment: it is read at the moment
              # someone is debugging a probe that did not classify. It must name
              # every recognised signature, or a base whose guard message was
              # reworded sends the reader hunting a permissions fault that does
              # not exist.
              echo "::error::the trusted scanner could not be probed"
              echo "  Expected one of: a parser (exit 2, 'unrecognised argument'); the"
              echo "  pre-parser no-op (exit 0, 'no binary or document files'); or the"
              echo "  pre-parser version guard (exit 1, 'fails the version guard')."
              echo "  Got none of them, so this is an execution failure — permissions,"
              echo "  interpreter, or a missing dependency — not the rollout window."
              echo "  probe exit=$probe_rc, output: $probe_out"
              exit 1 ;;
          esac

          echo "SCANNER_ROOT=$root" >> "$GITHUB_ENV"
          echo "scanner root: $root"

      # The character class needs 0-9: the checksum constants are named
      # ..._SHA256_LINUX_X64. Without it they are silently dropped and the
      # verification below compares against an empty string.
      #
      # Read from the TRUSTED root: the pinned version and its checksums are part of
      # the scanner, so a PR that could repoint them could choose which gitleaks build
      # judges it.
      #
      # The pattern names the THREE variables this workflow actually consumes rather
      # than accepting any `KEY=`. A blanket `^[A-Z0-9_]+=` forwards whatever the file
      # happens to contain straight into the job environment -- including names this
      # workflow never intended to set. That is harmless while the file is the kit's
      # own and the root is trusted, which is exactly the argument that stops being
      # true the day either changes. An allowlist costs nothing and does not depend on
      # the trust boundary holding.
      - name: Load pinned versions
        run: |
          set -euo pipefail
          grep -E '^(GITLEAKS_PINNED_VERSION|GITLEAKS_PINNED_SHA256_LINUX_(X64|ARM64))=' \
            "$SCANNER_ROOT/scripts/gitleaks-version.env" >> "$GITHUB_ENV"

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)  arch=x64;   want="${GITLEAKS_PINNED_SHA256_LINUX_X64:-}" ;;
            aarch64) arch=arm64; want="${GITLEAKS_PINNED_SHA256_LINUX_ARM64:-}" ;;
            *) echo "::error::unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          # Say plainly that a constant is missing. Comparing against an empty
          # string still fails closed, but it reports as "checksum mismatch,
          # expected <blank>", which sends you to look at the wrong thing.
          if [ -z "${GITLEAKS_PINNED_VERSION:-}" ] || [ -z "$want" ]; then
            echo "::error::a pinned constant is missing from scripts/gitleaks-version.env"
            echo "  GITLEAKS_PINNED_VERSION='${GITLEAKS_PINNED_VERSION:-}'"
            echo "  expected-sha for ${arch}='${want}'"
            exit 1
          fi

          tarball="gitleaks_${GITLEAKS_PINNED_VERSION}_linux_${arch}.tar.gz"
          # Bounded. The checksum below is what makes the download SAFE, but it only
          # runs once the download finishes -- an endless or enormous response is a
          # stuck job, not a rejected one, and the surrounding timeout-minutes then
          # reports it as a timed-out secret scan rather than a bad fetch. Real
          # release tarballs are ~5-8 MB; 64 MB leaves generous headroom while still
          # refusing a response that is clearly not this artifact.
          #   --max-time       seconds for ONE attempt -- it RESETS on each retry,
          #                    so alone it bounds an attempt, not the step
          #   --retry-max-time caps the whole retry sequence; without it 3 retries
          #                    at 120s each is a 360s worst case, and the bound
          #                    this comment claims would not exist
          #   --max-filesize   refuses when the advertised size exceeds the cap.
          #                    BEST-EFFORT BY CONSTRUCTION: it acts on Content-Length,
          #                    which GitHub release assets do send. --max-time is the
          #                    version-independent backstop and is what actually
          #                    guarantees the step terminates, so no curl version
          #                    assertion is needed here.
          #   --retry          transient 5xx/network, not a slow trickle
          curl -sSfL --max-time 120 --retry-max-time 120 \
            --max-filesize 67108864 --retry 3 --retry-delay 2 \
            -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_PINNED_VERSION}/${tarball}"

          # An unverified download is a supply-chain hole in the tool that guards the repo.
          got=$(sha256sum "$tarball" | cut -d' ' -f1)
          if [ "$got" != "$want" ]; then
            echo "::error::checksum mismatch for ${tarball}"
            echo "  expected ${want}"
            echo "  got      ${got}"
            exit 1
          fi

          # Deliberately NOT /usr/bin: the self-test asserts the guard errors when no
          # gitleaks is on PATH, which it checks by falling back to the system dirs.
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Confirm the pinned binary is the one on PATH
        run: |
          set -euo pipefail
          got=$(gitleaks version)
          if [ "$got" != "$GITLEAKS_PINNED_VERSION" ]; then
            echo "::error::expected gitleaks ${GITLEAKS_PINNED_VERSION}, PATH resolved to ${got}"
            exit 1
          fi
          echo "gitleaks ${got} (pinned, checksum-verified)"

      # Behavioural proof, at the pinned version. If .gitleaks.toml's documented
      # coverage has drifted, this fails before the scan below can report a
      # reassuring green on unknown coverage.
      #
      # This is the GATING run. It is normally the trusted copy: a self-test the
      # candidate can edit proves whatever the candidate wants it to prove.
      # NOT named "(trusted)": in the first-adoption window SCANNER_ROOT is the
      # checkout itself, so this gates on candidate code. That is argued for where
      # the fallback is set -- the workflow running it is candidate code too -- but
      # a static label claiming a trusted verdict would state it as fact on exactly
      # the run where it is false. The step says which copy it used instead.
      # Block scalar, and the path quoted INSIDE it. YAML consumes a surrounding
      # quote, so `run: "$X/..."` reaches the shell unquoted and word-splits.
      - name: Prove documented coverage still holds (gating)
        run: |
          set -euo pipefail
          # BOTH conditions. On push/workflow_dispatch SCANNER_ROOT is ALWAYS the
          # workspace by design -- there is no base to distrust -- so testing the root
          # alone announced "first adoption" on every push a repo ever made. The
          # rollout window is a pull_request property; say so.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$SCANNER_ROOT" = "$GITHUB_WORKSPACE" ]; then
            echo "::notice::Gating on the CANDIDATE's self-test: no trusted scanner exists"
            echo "::notice::on the base yet (first adoption). Trusted from the next PR on."
          elif [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "gating on the pushed commit at $SCANNER_ROOT (no base to distrust)"
          else
            echo "gating on the trusted copy at $SCANNER_ROOT"
          fi
          "$SCANNER_ROOT/scripts/test-gitleaks-guard.sh"

      - name: Full-history secret scan
        run: |
          set -euo pipefail
          rc=0
          # Trusted guard, trusted config. Passing --config explicitly matters: with
          # it omitted gitleaks discovers .gitleaks.toml from the repo root, which is
          # the candidate's copy — the allowlist the PR could have widened.
          out=$("$SCANNER_ROOT/scripts/gitleaks-guard.sh" git \
                  --config "$SCANNER_ROOT/.gitleaks.toml" \
                  --no-banner --redact --log-level info 2>&1) || rc=$?
          printf '%s\n' "$out"

          # A check that passed while scanning zero input is not a pass. gitleaks
          # reports the volume it examined; if that is zero, the green tick means
          # "not inspected", which is a different claim from "clean".
          #
          # THE ABSENCE of the volume line has to fail too, and it did not. Matching
          # only `scanned ~0 bytes` means output with no volume line at all -- a
          # changed log format, a different binary, a truncated capture -- takes the
          # same path as a genuine clean scan. That is the identical defect one level
          # up: the check stops being able to tell "inspected nothing" from
          # "inspected everything and found nothing". Reproduced against three
          # synthetic outputs before this was changed; the absent-line case passed.
          # MATCHED WITH [[ ]], NOT A grep PIPELINE — and this is a direct
          # consequence of the `set -euo pipefail` added to this step.
          #
          # `printf '%s' "$out" | grep -q ...` has grep exit the moment it
          # matches, which closes the pipe while printf is still writing. On a
          # large $out printf then dies of SIGPIPE (141), and `pipefail` makes
          # THAT the pipeline's status rather than grep's 0. Measured on a 2 MB
          # payload: both guards returned 141.
          #
          # The two failures point in opposite directions, which is what makes it
          # worth this comment:
          #   - the first guard is negated, so 141 reads as "no volume line" and
          #     ABORTS A PERFECTLY GOOD SCAN
          #   - the second is not, so 141 reads as "no zero-byte line" and the
          #     ZERO-BYTE REJECTION IS SKIPPED ENTIRELY — a scan that examined
          #     nothing passes, which is the exact thing this block exists to
          #     prevent, reintroduced by the hardening flag.
          #
          # [[ ]] operates on the variable directly: no pipe, no SIGPIPE, no
          # dependence on pipefail. Do not "simplify" it back to grep.
          if [[ ! $out =~ scanned\ ~[0-9]+\ bytes ]]; then
            echo "::error::no scan-volume line in gitleaks output — cannot confirm anything was read"
            echo "  Expected a 'scanned ~N bytes' line. Treat this as UNKNOWN, not clean."
            exit 1
          fi
          # Same reasoning as the guard above: a substring test on the variable,
          # not a pipeline that can die of SIGPIPE under pipefail. This is the
          # one that failed DANGEROUSLY — skipped, letting a zero-byte scan pass.
          if [[ $out == *"scanned ~0 bytes"* ]]; then
            echo "::error::the scan examined 0 bytes — treat this as UNKNOWN, not clean"
            exit 1
          fi
          exit "$rc"

      # The scan above is TEXT ONLY, and provably so: gitleaks' built-in allowlist
      # skips pdf/xlsx/docx/svg BY PATH, so it reports `scanned ~0 bytes` on them and
      # exits 0. Until this step existed, a PR adding a secret-bearing .xlsx was
      # blocked by the local pre-commit hook and PASSED here — the gate this kit calls
      # authoritative being the weaker of the two.
      #
      # Trusted scanner, candidate range: same trust boundary as every step above.
      # --config is not optional here. Without it the script falls back to the repo
      # root's .gitleaks.toml, which on a pull_request is the candidate's copy.
      # scan-staged-binaries.sh extracts PDFs with pdftotext, and a MISSING pdftotext
      # is not a soft degradation there -- the file is reported UNKNOWN and UNKNOWN
      # fails the gate. So without this step any PR touching a .pdf fails CI with a
      # message about installing poppler on a machine nobody owns.
      #
      # Conditional rather than unconditional because whether the runner image ships
      # poppler-utils is not something this file should assert: probe for the tool and
      # install only if absent. That is correct either way and costs one `command -v`
      # on the common path. (The fleet's earlier CI lineage installed it
      # unconditionally, which is the evidence that it is at least sometimes absent.)
      - name: Ensure pdftotext is available
        run: |
          set -euo pipefail
          if command -v pdftotext >/dev/null 2>&1; then
            echo "pdftotext already present: $(pdftotext -v 2>&1 | head -1)"
          else
            echo "pdftotext absent — installing poppler-utils"
            # Retried because this is the one external network call on the scan
            # path: a transient mirror failure would otherwise surface as an apt
            # error, not a scan error. If all attempts fail, fall through — the
            # guard below names the real consequence (PDFs would report UNKNOWN)
            # instead of the step dying mid-`&&` with apt's message.
            for attempt in 1 2 3; do
              if sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; then
                break
              fi
              echo "apt-get attempt $attempt failed$( [ "$attempt" -lt 3 ] && echo '; retrying in 5s' )"
              [ "$attempt" -lt 3 ] && sleep 5
            done
          fi
          # Fail here rather than three steps later as a per-file UNKNOWN.
          command -v pdftotext >/dev/null 2>&1 || {
            echo "::error::pdftotext is still unavailable; PDFs would report UNKNOWN"
            exit 1; }

      # The binary scanner gets the same treatment as the text one: prove it still
      # behaves before trusting its verdict, at the pinned version, on a machine that
      # is not a developer's laptop. Trusted copy, for the reason every other
      # authoritative step here uses the trusted copy.
      #
      # Skipped in the bootstrap window: a base predating this change ships a
      # self-test that cannot exercise --range/--tree, so running it would prove
      # something other than what the next step depends on.
      - name: Prove the binary scan still works (trusted)
        if: env.SCANNER_RANGE_SUPPORT == 'yes'
        run: |
          set -euo pipefail
          "$SCANNER_ROOT/scripts/selftest-binary-scan.sh"

      - name: Binary and document secret scan
        run: |
          set -euo pipefail
          # Refuse to produce a verdict rather than produce a false one. The
          # bootstrap window is the only way to reach this, and the warning above
          # already named it; repeating it here means the step's OWN output never
          # reads as a clean binary scan.
          if [ "$SCANNER_RANGE_SUPPORT" != yes ]; then
            echo "::warning::SKIPPED — the trusted scanner cannot scan a range."
            echo "This is NOT a clean result. Binaries in this PR are UNINSPECTED;"
            echo "judge them by hand, exactly as before this workflow existed."
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # BASE_SHA/HEAD_SHA via env, never interpolated into this script body.
            "$SCANNER_ROOT/scripts/scan-staged-binaries.sh" \
              --range "$BASE_SHA" "$HEAD_SHA" \
              --config "$SCANNER_ROOT/.gitleaks.toml"
          else
            # No range on a push: audit the whole tree. Cheap, and it is the backstop
            # for anything that reached the branch without a PR.
            "$SCANNER_ROOT/scripts/scan-staged-binaries.sh" \
              --tree HEAD \
              --config "$SCANNER_ROOT/.gitleaks.toml"
          fi
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      # ADVISORY, never gating. The trusted run above cannot see a PR's changes to
      # .gitleaks.toml or to the guard scripts, so without this a PR that breaks the
      # scanner would look perfectly clean until the following PR. Running it here
      # keeps that visible to the author while leaving the verdict with the trusted
      # copy. `continue-on-error` rather than `|| true` on purpose: a swallowed
      # failure renders as a green tick, and the point is to SHOW the breakage.
      #
      # LAST ON PURPOSE, AND THAT IS A TRUST-BOUNDARY REQUIREMENT, not tidiness.
      # This is the only step that executes CANDIDATE code. While it sat above the
      # gating scans it could write $GITHUB_ENV or $GITHUB_PATH -- rewriting
      # SCANNER_ROOT, or putting a candidate-supplied `gitleaks` earlier on PATH --
      # and every gating step below would have read it. A PR could then choose the
      # scanner that judged it, which is precisely the defect the trusted checkout
      # exists to remove; the boundary was reinstated at the top of the job and
      # handed back four steps later. Nothing reads those variables after this
      # point, so the same write is now inert.
      # Keep it last. Any new gating step belongs ABOVE this one.
      #
      # Skipped when the scanner root is the checkout itself -- it would be the same
      # run twice, and a duplicated advisory result reads as two independent ones.
      # GATED ON THE ROOT, NOT THE EVENT. `event_name == 'pull_request'` was a
      # proxy for "a separate trusted root exists", true only while every PR had
      # one. The first-adoption fallback broke that equivalence and this comment
      # was false for one release: the advisory step ran the same script the gating
      # step had just run, from the same directory.
      - name: Candidate's own coverage self-test (ADVISORY — does not gate)
        if: github.event_name == 'pull_request' && env.SCANNER_ROOT != github.workspace
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "::notice::Advisory only. This runs the PR's OWN self-test, which the PR"
          echo "::notice::can edit, so it decides nothing. The gating verdict is the"
          echo "::notice::trusted run earlier in this job. A failure here means this PR"
          echo "::notice::changes the scanner in a way its own tests reject — worth reading."
          ./scripts/test-gitleaks-guard.sh

      - name: Standing limits
        if: always()
        run: |
          set -euo pipefail
          echo "::notice::Archives (xlsx/docx/zip...), text-layer PDFs and .svg ARE"
          echo "::notice::inspected — by the binary scan step, not by gitleaks itself."
          echo "::notice::Still NOT read here: images, video, compiled binaries, legacy"
          echo "::notice::Office (.doc/.xls) and image-only PDFs. That step REPORTS"
          echo "::notice::those rather than inspecting them — read its output and judge"
          echo "::notice::them by hand. See the STANDING LIMIT note in .gitleaks.toml."
